# ============================================================
# docker-compose.yml — TiendaMiBarrio
# ============================================================
# Uso:
#   docker compose up -d            # Iniciar todos los servicios
#   docker compose logs -f          # Ver logs
#   docker compose down -v          # Detener y eliminar volúmenes
# ============================================================
# Configura las variables en un archivo .env (ver .env.example)
# o directamente en el entorno.
#
# Migraciones: al arrancar, el contenedor app ejecuta entrypoint.sh,
# que aplica automáticamente mysql/all-migrations.sql si no se ha
# ejecutado aún (controlado en la tabla schema_migrations). Para
# agregar una migración nueva, editar all-migrations.sql y reconstruir
# la imagen de la app.
# ============================================================

services:
  # ---- MySQL 8 ----
  db:
    image: mysql:8.4.9-oraclelinux9
    container_name: tienda_mb_db
    restart: unless-stopped
    environment:
      TZ: ${TIMEZONE:-America/Havana}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-tienda_mi_barrio}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "${DB_PORT_EXTERNAL:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-rootpassword}"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---- Valkey (Redis-compatible cache) ----
  valkey:
    image: valkey/valkey:9.1-alpine
    container_name: tienda_mb_valkey
    restart: unless-stopped
    command: valkey-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "${VALKEY_PORT_EXTERNAL:-6380}:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---- Next.js App ----
  app:
    image: yordo81/tienda_mb_app:latest
    container_name: tienda_mb_app
    restart: unless-stopped
    entrypoint: ["/entrypoint.sh"]
    command: ["node", "server.js"]
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-rootpassword}
      DB_NAME: ${DB_NAME:-tienda_mi_barrio}
      SESSION_SECRET: ${SESSION_SECRET:-cambiar_esto_por_un_secreto_de_32_caracteres}
      # Secure en la cookie de sesión: solo activar detrás de HTTPS.
      # Con HTTP plano (LAN/hosts) debe quedar false o el navegador
      # descarta la cookie y el login rebota al login sin error.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TIMEZONE: ${TIMEZONE:-America/Havana}
      VALKEY_URL: redis://valkey:6379
      HTTPS_ENABLED: ${HTTPS_ENABLED:-false}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      USER_ACTIVE_CACHE_TTL_MS: ${USER_ACTIVE_CACHE_TTL_MS:-30000}
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy

volumes:
  mysql_data:
    name: tienda_mb_data
  valkey_data:
    name: tienda_mb_valkey
