# ============================================================
# docker-compose.yml — TiendaMiBarrio
# ============================================================
# Uso:
#   docker compose up -d            # Iniciar todos los servicios
#   docker compose logs -f          # Ver logs
#   docker compose down -v          # Detener y eliminar volúmenes
# ============================================================

services:
  # ---- MySQL 8 ----
  db:
    image: mysql:8.4.9-oraclelinux9
    restart: unless-stopped
    environment:
      TZ: ${TIMEZONE:-America/Havana}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-tienda_mi_barrio}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "${DB_PORT_EXTERNAL:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---- Valkey (Redis-compatible cache) ----
  valkey:
    image: valkey/valkey:9.1-alpine
    restart: unless-stopped
    command: valkey-server --maxmemory 128mb --maxmemory-policy allkeys-lru --requirepass ${VALKEY_PASSWORD:-tienda_valkey_secret}
    ports:
      - "${VALKEY_PORT_EXTERNAL:-6380}:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${VALKEY_PASSWORD:-tienda_valkey_secret}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---- Next.js App ----
  app:
    image: yordo81/tienda_mb_app:latest
    restart: unless-stopped
    # El orden real lo garantiza entrypoint.sh (espera a MySQL y aplica
    # migraciones antes de arrancar); depends_on solo fija el orden de
    # arranque de los contenedores.
    depends_on:
      db:
        condition: service_started
      valkey:
        condition: service_started
    entrypoint: ["/entrypoint.sh"]
    command: ["node", "server.js"]
    ports:
      - "${APP_PORT:-3001}:3000"
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-rootpassword}
      DB_NAME: ${DB_NAME:-tienda_mi_barrio}
      SESSION_SECRET: ${SESSION_SECRET:-cambiar_esto_por_un_secreto_de_32_caracteres}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TIMEZONE: ${TIMEZONE:-America/Havana}
      VALKEY_URL: redis://:${VALKEY_PASSWORD:-tienda_valkey_secret}@valkey:6379
      HTTPS_ENABLED: ${HTTPS_ENABLED:-false}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3001}
      USER_ACTIVE_CACHE_TTL_MS: ${USER_ACTIVE_CACHE_TTL_MS:-30000}

volumes:
  mysql_data:
    name: tienda_mb_data_cache
  valkey_data:
    name: tienda_mb_valkey_cache
